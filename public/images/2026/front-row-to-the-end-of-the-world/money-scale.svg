<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="A trillion dollars is a million millions, and Elon Musk has more than that" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="100%" height="100%" rx="12" fill="#ffffff"/><text x="24" y="30" font-size="16" font-weight="600" fill="#1f2328">A trillion dollars is a million millions, and Elon Musk has more than that</text><text x="24" y="52" font-size="12" fill="#59636e">Same idea as the chart above: a normal scale, bars start at zero. The time is counting one dollar per second.</text><line x1="300" x2="300" y1="76" y2="434" stroke="#8c959f"></line><g><g><text x="24" y="96" font-size="13" font-weight="600" fill="#1f2328">One dollar</text><text x="24" y="112" font-size="11.5" fill="#59636e">$1</text><text x="24" y="127" font-size="11.5" fill="#59636e">counting it: 1 second</text><rect x="300" y="90" width="2.8846153846153845e-10" height="20" rx="3" fill="#8c959f"><title>One dollar: $1</title></rect><text x="308.0000000002885" y="104" font-size="12" fill="#59636e">too small to see at this scale</text></g><g><text x="24" y="158" font-size="13" font-weight="600" fill="#1f2328">A hundred dollars</text><text x="24" y="174" font-size="11.5" fill="#59636e">$100</text><text x="24" y="189" font-size="11.5" fill="#59636e">counting it: 1.7 minutes</text><rect x="300" y="152" width="2.8846153846153848e-8" height="20" rx="3" fill="#8c959f"><title>A hundred dollars: $100</title></rect><text x="308.00000002884616" y="166" font-size="12" fill="#59636e">too small to see at this scale</text></g><g><text x="24" y="220" font-size="13" font-weight="600" fill="#1f2328">A million dollars</text><text x="24" y="236" font-size="11.5" fill="#59636e">$1,000,000</text><text x="24" y="251" font-size="11.5" fill="#59636e">counting it: 11.6 days</text><rect x="300" y="214" width="0.00028846153846153843" height="20" rx="3" fill="#8c959f"><title>A million dollars: $1,000,000</title></rect><text x="308.00028846153845" y="228" font-size="12" fill="#59636e">too small to see at this scale</text></g><g><text x="24" y="282" font-size="13" font-weight="600" fill="#1f2328">A billion dollars</text><text x="24" y="298" font-size="11.5" fill="#59636e">$1,000,000,000</text><text x="24" y="313" font-size="11.5" fill="#59636e">counting it: 31.7 years</text><rect x="300" y="276" width="0.2884615384615385" height="20" rx="3" fill="#8c959f"><title>A billion dollars: $1,000,000,000</title></rect><text x="308.28846153846155" y="290" font-size="12" fill="#59636e">too small to see at this scale</text></g><g><text x="24" y="344" font-size="13" font-weight="600" fill="#1f2328">A trillion dollars</text><text x="24" y="360" font-size="11.5" fill="#59636e">$1,000,000,000,000</text><text x="24" y="375" font-size="11.5" fill="#59636e">counting it: 31,688 years</text><rect x="300" y="338" width="288.46153846153845" height="20" rx="3" fill="#8c959f"><title>A trillion dollars: $1,000,000,000,000</title></rect><text x="596.4615384615385" y="352" font-size="12" fill="#59636e"></text></g><g><text x="24" y="406" font-size="13" font-weight="600" fill="#1f2328">Elon Musk (Oct 5, 2026)</text><text x="24" y="422" font-size="11.5" fill="#59636e">$1,040,000,000,000</text><text x="24" y="437" font-size="11.5" fill="#59636e">counting it: 32,956 years</text><rect x="300" y="400" width="300" height="20" rx="3" fill="#5828a8"><title>Elon Musk (Oct 5, 2026): $1,040,000,000,000</title></rect><text x="608" y="414" font-size="12" fill="#59636e"></text></g></g><text x="24" y="482" font-size="11.5" fill="#59636e">Musk: Bloomberg Billionaires Index, $1.04 trillion on October 5, 2026. The rest is arithmetic.</text></svg>