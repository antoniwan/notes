allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@astrojs/telemetry@3.3.3'
  - astro@7.0.7 || 7.1.4 || 7.2.1
  - '@astrojs/mdx@7.0.4'
onlyBuiltDependencies:
  - '@vercel/speed-insights'
  - esbuild
  - sharp
  - simple-git-hooks

overrides:
  tar: 7.5.8
  minimatch: 9.0.7
  fast-xml-parser: 5.3.8
  ajv: 6.14.0
  rollup: 4.59.0
  devalue: 5.6.3

peerDependencyRules:
  allowAny:
    - tailwindcss
