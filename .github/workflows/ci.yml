name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No version here on purpose: action-setup reads package.json's
      # packageManager field, so CI and local development cannot drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run format check
        run: pnpm run format:check

      - name: Run Astro check
        run: pnpm run check

      - name: Run ESLint
        run: pnpm run lint

      - name: Check design tokens (rhythm and widths)
        run: pnpm run lint:tokens

      - name: Check image sizes
        run: pnpm run check-image-sizes

      - name: Audit content frontmatter
        run: pnpm run audit-frontmatter

      - name: Check structured-data module
        run: pnpm run validate-structured-data

      - name: Check Remark42 rewrite
        run: pnpm run check-remark42-rewrite

      # Astro keeps the optimized hero sizes here. Encoding them is most of the
      # build, so restore them unless an image or the image settings changed.
      - name: Restore optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/images/**', 'astro.config.mjs', 'src/utils/heroImages.ts', 'pnpm-lock.yaml') }}
          restore-keys: astro-images-

      - name: Build project
        run: pnpm run build

      # The build regenerates social cards and their manifest. They are tracked
      # in git, so a post merged without its card shows up here instead of in prod.
      - name: Check generated social images are committed
        run: |
          git status --porcelain -- public/social src/data
          test -z "$(git status --porcelain -- public/social src/data)"

      - name: Validate generated feeds
        run: pnpm run validate-feeds

      - name: Validate generated content contracts
        run: pnpm run validate-generated-content

      # After the build: these journeys drive the real dist/client output.
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for browser journeys
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser regression journeys
        run: pnpm run test:browser
