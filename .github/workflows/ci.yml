name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keeps regenerated social JPG/PNG warm between runs until they are committed to git.
      - name: Restore social derivatives cache
        uses: actions/cache@v4
        with:
          path: public/social
          key: ${{ runner.os }}-social-images-${{ hashFiles('public/**/*.avif', 'scripts/generate-social-images.js', 'src/data/socialImageFingerprints.json') }}
          restore-keys: |
            ${{ runner.os }}-social-images-

      # No version here on purpose: action-setup reads package.json's
      # packageManager field, so CI and local development cannot drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run format check
        run: pnpm run format:check

      - name: Run Astro check
        run: pnpm run check

      - name: Run ESLint
        run: pnpm run lint

      - name: Audit content frontmatter
        run: pnpm run audit-frontmatter

      - name: Check structured-data module
        run: pnpm run validate-structured-data

      - name: Check Remark42 rewrite
        run: pnpm run check-remark42-rewrite

      - name: Build project
        run: pnpm run build

      - name: Validate generated feeds
        run: pnpm run validate-feeds

      # After the build: these journeys drive the real dist/client output.
      - name: Install Chromium for browser journeys
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser regression journeys
        run: pnpm run test:browser
